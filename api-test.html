<!DOCTYPE html>
<html>
<head>
    <title>OpenAI API Test</title>
</head>
<body>
    <h1>OpenAI API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>
    
    <script type="module">
        async function testAPI() {
            const apiKey = 'VITE_OPENAI_API_KEY_PLACEHOLDER';
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{role: 'user', content: 'Say hello'}],
                        max_tokens: 50
                    })
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (!response.ok) {
                    resultDiv.innerHTML = `<pre style="color: red;">Error: ${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<pre style="color: green;">Success: ${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<pre style="color: red;">Error: ${error.message}</pre>`;
            }
        }
        
        window.testAPI = testAPI;
    </script>
</body>
</html>
