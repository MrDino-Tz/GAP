<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAP Visitor Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f8; color: #1a1a1a; padding: 24px;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; }
    .refresh { background: #1677ff; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .refresh:hover { background: #0958d9; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card .value { font-size: 2rem; font-weight: 700; }
    .card .label { color: #6b7280; font-size: .85rem; margin-top: 4px; }
    .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
    .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .panel h2 { font-size: 1rem; margin-bottom: 16px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 200px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar { width: 100%; background: #1677ff; border-radius: 3px 3px 0 0; transition: height .3s; min-height: 2px; }
    .bar-wrap span { font-size: .6rem; color: #9ca3af; margin-top: 4px; transform: rotate(-45deg); margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid #f0f0f0; }
    th { color: #6b7280; font-weight: 600; }
    .error { background: #fff1f0; color: #cf1322; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>GAP Visitor Dashboard</h1>
    <div>
      <button class="refresh" onclick="load()">Refresh</button>
    </div>
  </header>

  <div id="error" class="error" style="display:none"></div>

  <section class="cards" id="cards"></section>

  <section class="panels">
    <div class="panel">
      <h2>Views — last 30 days</h2>
      <div class="bars" id="chart"></div>
    </div>
    <div class="panel">
      <h2>Top pages</h2>
      <table id="paths"><thead><tr><th>Path</th><th>Views</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';

    const card = (value, label) =>
      `<div class="card"><div class="value">${value}</div><div class="label">${label}</div></div>`;

    const showError = (msg) => {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    };

    async function load() {
      document.getElementById('error').style.display = 'none';
      try {
        const res = await fetch(`/api/stats?days=30&token=${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error('Unauthorized or bad token — check /admin?token=YOUR_ADMIN_TOKEN');
        const data = await res.json();

        document.getElementById('cards').innerHTML =
          card(data.totals.views.toLocaleString(), 'Total views') +
          card(data.totals.unique.toLocaleString(), 'Unique visitors') +
          card(data.today.views.toLocaleString(), 'Views today') +
          card(data.today.unique.toLocaleString(), 'Unique today');

        const max = Math.max(1, ...data.daily.map((d) => d.views));
        document.getElementById('chart').innerHTML = data.daily
          .map((d) => {
            const h = Math.max(2, Math.round((d.views / max) * 100));
            return `<div class="bar-wrap" title="${d.day}: ${d.views} views">
                      <div class="bar" style="height:${h}%"></div>
                      <span>${d.day.slice(5)}</span>
                    </div>`;
          })
          .join('');

        document.querySelector('#paths tbody').innerHTML = (data.topPaths.length
          ? data.topPaths
          : [{ path: '—', views: 0 }]
        )
          .map((p) => `<tr><td>${p.path}</td><td>${p.views}</td></tr>`)
          .join('');
      } catch (err) {
        showError(err.message);
      }
    }

    load();
  </script>
</body>
</html>
